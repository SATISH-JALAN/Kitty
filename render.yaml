# Render Blueprint: the Kitty backend (API + indexer + Butler in one process) and its Postgres.
# Render dashboard → New → Blueprint → this repo. Secrets marked `sync: false` are asked for once.
services:
  - type: web
    name: kitty-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kitty-db
          property: connectionString
      - key: RPC_URL
        value: https://api.devnet.solana.com
      - key: PUBLIC_RPC_URL
        value: https://api.devnet.solana.com
      - key: KITTY_PROGRAM_ID
        value: 5BLmkW7GCc2R2AkpetqRPtFy51Gu5jvxLXzPNaQ6m15t
      - key: KITTY_MINT
        sync: false
      - key: RELAY_KEYPAIR
        sync: false
      - key: FAUCET_KEYPAIR
        sync: false
      - key: APP_ORIGINS
        sync: false
      - key: ARTIFACTS_BASE_URL
        sync: false
      - key: INDEXER_POLL_MS
        value: "4000"
      - key: BUTLER_TICK_MS
        value: "8000"

databases:
  - name: kitty-db
    plan: free
